services:
  - type: web
    name: summitlog-api
    runtime: docker
    dockerfilePath: ./server/SummitLog.Api/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: SummitLog
      - key: Jwt__Audience
        value: SummitLog
      - key: Jwt__ExpiryMinutes
        value: "1440"
      - key: Cors__ClientOrigin
        sync: false
      - key: Storage__ServiceUrl
        sync: false
      - key: Storage__AccessKey
        sync: false
      - key: Storage__SecretKey
        sync: false
      - key: Storage__BucketName
        sync: false
      - key: Email__ResendApiKey
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Client__BaseUrl
        sync: false
